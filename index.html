<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMA Melder-Scanner</title>
    <!-- Zuverlässige Bibliothek für Barcodes & QR-Codes über CDN -->
    <script src="https://unpkg.com"></script>
    <style>
        :root {
            --primary: #007aff;
            --success: #34c759;
            --bg: #f2f2f7;
            --card: #ffffff;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); margin: 0; padding: 15px; color: #000; }
        .container { max-width: 500px; margin: 0 auto; }
        h1, h2 { text-align: center; color: #1c1c1e; margin-bottom: 10px; font-size: 22px; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #000; }
        
        .result-box { text-align: center; font-size: 18px; font-weight: bold; color: var(--primary); padding: 10px; border: 2px dashed var(--primary); border-radius: 8px; margin: 10px 0; background: #f0f7ff; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 14px; font-weight: 600; color: #3a3a3c; margin-bottom: 4px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #c7c7cc; border-radius: 8px; font-size: 16px; box-sizing: border-box; background: #fff; }
        textarea { resize: vertical; height: 60px; font-family: inherit; }
        input:focus, textarea:focus { border-color: var(--primary); outline: none; }
        
        button { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s; margin-top: 5px; box-sizing: border-box; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:active { background-color: #0056b3; }
        .btn-success { background-color: var(--success); color: white; }
        .btn-success:active { background-color: #248a3d; }
        .btn-secondary { background-color: #8e8e93; color: white; }
        
        .counter { text-align: center; font-size: 14px; color: #8e8e93; margin-top: 5px; }
        .output-box { font-family: monospace; background: #e5e5ea; padding: 10px; border-radius: 8px; font-size: 11px; max-height: 120px; overflow-y: auto; white-space: pre-wrap; margin-top: 10px; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>BMA Melder-Scanner</h1>

    <!-- 1. SCANNER CARD -->
    <div class="card">
        <button id="btn-start-cam" class="btn-primary" onclick="startScanner()">Kamera aktivieren</button>
        
        <div id="reader" class="hidden"></div>
        <div id="scan-result" class="result-box">Bitte Kamera aktivieren...</div>
        <button id="btn-restart" class="btn-secondary" style="display:none;" onclick="startScanner()">Neuen Scan starten</button>
    </div>

    <!-- 2. DATA ENTRY FORM -->
    <div class="card" id="form-card">
        <h2>Eingabefelder</h2>
        <div class="form-group">
            <label>Gescannte Nummer</label>
            <input type="text" id="melder-id" readonly style="background-color: #e5e5ea; color: #555;">
        </div>
        <div class="form-group">
            <label>Gruppennummer</label>
            <input type="text" id="input-gruppe" placeholder="z.B. 12">
        </div>
        <div class="form-group">
            <label>Meldernummer</label>
            <input type="text" id="input-melder" placeholder="z.B. 4">
        </div>
        <div class="form-group">
            <label>Zusatztext</label>
            <input type="text" id="input-zusatz" placeholder="z.B. Flur OG">
        </div>
        <div class="form-group">
            <label>Bemerkungen</label>
            <textarea id="input-bemerkung" placeholder="z.B. Melder verschmutzt"></textarea>
        </div>
        <button class="btn-success" onclick="saveData()">Speichern</button>
    </div>

    <!-- 3. EXPORT / DATA MANAGEMENT -->
    <div class="card">
        <h2>Gespeicherte Daten (JSON)</h2>
        <div class="counter" id="data-count">0 Melder gespeichert</div>
        <div class="output-box" id="json-preview">[]</div>
        <button class="btn-primary" style="margin-top: 10px;" onclick="shareData()">Daten übertragen / Mail</button>
        <button class="btn-secondary" style="margin-top: 8px; background-color: #ff3b30;" onclick="clearLocalStorage()">Daten auf iPhone löschen</button>
    </div>
</div>

<script>
    let html5QrCode;
    const STORAGE_KEY = "bma_scanned_detectors";

    window.onload = function() {
        updatePreview();
    };

    function startScanner() {
        document.getElementById('btn-start-cam').classList.add('hidden');
        document.getElementById('reader').classList.remove('hidden');
        document.getElementById('btn-restart').style.display = 'none';
        document.getElementById('scan-result').innerText = "Kamera wird gestartet...";
        
        // Wir nutzen hier die Pro-Klasse "Html5Qrcode" für direkte, fehlerfreie iOS-Kontrolle
        if (!html5QrCode) {
            html5QrCode = new Html5Qrcode("reader");
        }
        
        // iOS-optimierte Hardware-Konfiguration
        const config = { 
            fps: 10, 
            qrbox: function(viewfinderWidth, viewfinderHeight) {
                // Erstellt ein perfekt skaliertes, quadratisches Scanfenster für Mobilgeräte
                const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
                const size = Math.floor(minEdge * 0.7);
                return { width: size, height: size };
            }
        };
        
        // Startet explizit die Rückkamera ("environment") mit flexiblen Videoauflösungen
        html5QrCode.start(
            { facingMode: "environment" }, 
            config,
            onScanSuccess,
            onScanFailure
        ).then(() => {
            document.getElementById('scan-result').innerText = "Kamera aktiv. Code scannen...";
        }).catch(err => {
            document.getElementById('scan-result').innerText = "Fehler: " + err;
            document.getElementById('btn-start-cam').classList.remove('hidden');
            console.error("Kamerastart fehlgeschlagen", err);
        });
    }

    function onScanSuccess(decodedText, decodedResult) {
        let cleanText = decodedText.trim();
        
        document.getElementById('scan-result').innerText = "Erfolgreich: " + cleanText;
        document.getElementById('melder-id').value = cleanText;
        
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().then(() => {
                document.getElementById('btn-restart').style.display = 'block';
            }).catch(err => console.error("Fehler beim Stoppen", err));
        }
        
        if (navigator.vibrate) navigator.vibrate(100);
    }

    function onScanFailure(error) {
        // Stummschalten für bessere iOS-Performance
    }

    function getStoredData() {
        let data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : [];
    }

    function saveData() {
        let id = document.getElementById('melder-id').value;
        if (!id) {
            alert("Bitte scannen Sie zuerst einen Melder-Code!");
            return;
        }

        let currentData = getStoredData();

        let entry = {
            id: id,
            gruppennummer: document.getElementById('input-gruppe').value.trim(),
            meldernummer: document.getElementById('input-melder').value.trim(),
            zusatztext: document.getElementById('input-zusatz').value.trim(),
            bemerkungen: document.getElementById('input-bemerkung').value.trim(),
            zeitstempel: new Date().toISOString()
        };

        let existingIndex = currentData.findIndex(item => item.id === id);
        if (existingIndex > -1) {
            currentData[existingIndex] = entry;
        } else {
            currentData.push(entry);
        }

        localStorage.setItem(STORAGE_KEY, JSON.stringify(currentData));

        document.getElementById('melder-id').value = "";
        document.getElementById('input-melder').value = "";
        document.getElementById('input-zusatz').value = "";
        document.getElementById('input-bemerkung').value = "";
        document.getElementById('scan-result').innerText = "Warte auf Barcode / QR-Code...";

        updatePreview();
        alert("Daten erfolgreich lokal gesichert!");
        
        startScanner();
    }

    function updatePreview() {
        let data = getStoredData();
        document.getElementById('data-count').innerText = data.length + " Melder gespeichert";
        document.getElementById('json-preview').innerText = JSON.stringify(data, null, 2);
    }

    function shareData() {
        let dataStr = localStorage.getItem(STORAGE_KEY);
        if (!dataStr || dataStr === "[]") {
            alert("Keine Daten zum Übertragen vorhanden.");
            return;
        }

        let blob = new Blob([dataStr], { type: "application/json" });
        let file = new File([blob], "bma_export.json", { type: "application/json" });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({
                files: [file],
                title: 'BMA Melder Export',
                text: 'Hier sind die gescannten Melderdaten im JSON-Format.'
            }).catch(err => console.log("Teilen abgebrochen", err));
        } else {
            let mailtoLink = "mailto:?subject=BMA%20Melder%20Export&body=" + encodeURIComponent(dataStr);
            window.location.href = mailtoLink;
        }
    }

    function clearLocalStorage() {
