<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melder Scanner V01.03R000</title>
    <!-- Wir laden keine großen Frameworks mehr, sondern nutzen ein extrem leichtes, reines Auslese-Skript -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --primary: #007aff;
            --success: #34c759;
            --bg: #f2f2f7;
            --card: #ffffff;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); margin: 0; padding: 15px; color: #000; }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { text-align: center; color: #1c1c1e; margin-bottom: 10px; font-size: 22px; }
        .version-tag { text-align: center; font-size: 12px; color: #8e8e93; margin-top: -8px; margin-bottom: 15px; font-weight: bold; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
        
        #native-camera-input { display: none; }
        
        .result-box { text-align: center; font-size: 18px; font-weight: bold; color: var(--primary); padding: 10px; border: 2px dashed var(--primary); border-radius: 8px; margin: 10px 0; background: #f0f7ff; word-break: break-all; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 14px; font-weight: 600; color: #3a3a3c; margin-bottom: 4px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #c7c7cc; border-radius: 8px; font-size: 16px; box-sizing: border-box; background: #fff; }
        textarea { resize: vertical; height: 60px; font-family: inherit; }
        
        button, .label-btn { display: block; width: 100%; padding: 12px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-align: center; box-sizing: border-box; text-decoration: none; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-success { background-color: var(--success); color: white; }
        .btn-secondary { background-color: #8e8e93; color: white; }
        
        .counter { text-align: center; font-size: 14px; color: #8e8e93; margin-top: 5px; }
        .output-box { font-family: monospace; background: #e5e5ea; padding: 10px; border-radius: 8px; font-size: 11px; max-height: 120px; overflow-y: auto; white-space: pre-wrap; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Melder Scanner</h1>
    <div class="version-tag">V01.03R000</div>

    <!-- 1. SCANNER CARD -->
    <div class="card">
        <label for="native-camera-input" class="label-btn btn-primary">Kamera aktivieren & Barcode scannen</label>
        <input type="file" id="native-camera-input" accept="image/*" capture="environment" onchange="decodeBarcode(this)">
        
        <div id="scan-result" class="result-box">Warte auf Barcode-Foto...</div>
    </div>

    <!-- 2. DATA ENTRY FORM -->
    <div class="card" id="form-card">
        <h2>Eingabefelder</h2>
        <div class="form-group">
            <label>Gescannte Nummer</label>
            <input type="text" id="melder-id" readonly style="background-color: #e5e5ea; color: #555;">
        </div>
        <div class="form-group">
            <label>Gruppennummer</label>
            <input type="text" id="input-gruppe" placeholder="z.B. 12">
        </div>
        <div class="form-group">
            <label>Meldernummer</label>
            <input type="text" id="input-melder" placeholder="z.B. 4">
        </div>
        <div class="form-group">
            <label>Zusatztext</label>
            <input type="text" id="input-zusatz" placeholder="z.B. Flur OG">
        </div>
        <div class="form-group">
            <label>Bemerkungen</label>
            <textarea id="input-bemerkung" placeholder="z.B. Melder verschmutzt"></textarea>
        </div>
        <button class="btn-success" onclick="saveData()">Speichern</button>
    </div>

    <!-- 3. EXPORT / DATA MANAGEMENT -->
    <div class="card">
        <h2>Gespeicherte Daten (JSON)</h2>
        <div class="counter" id="data-count">0 Melder gespeichert</div>
        <div class="output-box" id="json-preview">[]</div>
        <button class="btn-primary" style="margin-top: 10px;" onclick="shareData()">Daten übertragen / Mail</button>
        <button class="btn-secondary" style="margin-top: 8px; background-color: #ff3b30;" onclick="clearLocalStorage()">Daten auf iPhone löschen</button>
    </div>
</div>

<script>
    const STORAGE_KEY = "bma_scanned_detectors";

    window.onload = function() {
        updatePreview();
    };

    function decodeBarcode(input) {
        if (!input.files || input.files.length === 0) return;
        
        document.getElementById('scan-result').innerText = "Analysiere Foto-Pixel...";
        const file = input.files[0];
        const reader = new FileReader();
        
        reader.onload = function(e) {
            // Quagga2-Decoder für statische Bilddateien auf iOS initialisieren
            Quagga.decodeSingle({
                decoder: {
                    // Unterstützt Code 128 (Esser-Standard) sowie EAN-Strichcodes
                    readers: ["code_128_reader", "ean_reader", "code_39_reader"] 
                },
                locate: true,
                src: e.target.result
            }, function(result) {
                if (result && result.codeResult) {
                    let finalCode = result.codeResult.code.trim();
                    document.getElementById('scan-result').innerText = "Erfolgreich: " + finalCode;
                    document.getElementById('melder-id').value = finalCode;
                    if (navigator.vibrate) navigator.vibrate(100);
                } else {
                    // Fallback-Schutz, falls das Foto zu dunkel, unscharf oder verwackelt war
                    document.getElementById('scan-result').innerText = "Code unleserlich. Bitte schärfer fotografieren.";
                    
                    // Demo-ID eintragen, damit Sie die Datenstruktur weitertesten können
                    document.getElementById('melder-id').value = "138100029895"; 
                }
            });
        };
        
        reader.readAsDataURL(file);
    }

    function getStoredData() {
        let data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : [];
    }

    function saveData() {
        let id = document.getElementById('melder-id').value;
        if (!id) {
            alert("Bitte fotografieren Sie zuerst einen Barcode!");
            return;
        }

        let currentData = getStoredData();
        let entry = {
            id: id,
            gruppennummer: document.getElementById('input-gruppe').value.trim(),
            meldernummer: document.getElementById('input-melder').value.trim(),
            zusatztext: document.getElementById('input-zusatz').value.trim(),
            bemerkungen: document.getElementById('input-bemerkung').value.trim(),
            zeitstempel: new Date().toISOString()
        };

        let existingIndex = currentData.findIndex(item => item.id === id);
        if (existingIndex > -1) {
            currentData[existingIndex] = entry;
        } else {
            currentData.push(entry);
        }

        localStorage.setItem(STORAGE_KEY, JSON.stringify(currentData));

        document.getElementById('melder-id').value = "";
        document.getElementById('input-melder').value = "";
        document.getElementById('input-zusatz').value = "";
        document.getElementById('input-bemerkung').value = "";
        document.getElementById('scan-result').innerText = "Warte auf Barcode-Foto...";

        updatePreview();
        alert("Daten erfolgreich lokal gesichert!");
    }

    function updatePreview() {
        let data = getStoredData();
        document.getElementById('data-count').innerText = data.length + " Melder gespeichert";
        document.getElementById('json-preview').innerText = JSON.stringify(data, null, 2);
    }

    function shareData() {
        let dataStr = localStorage.getItem(STORAGE_KEY);
        if (!dataStr || dataStr === "[]") {
            alert("Keine Daten zum Übertragen vorhanden.");
            return;
        }

        let blob = new Blob([dataStr], { type: "application/json" });
        let file = new File([blob], "bma_export.json", { type: "application/json" });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({
                files: [file],
                title: 'BMA Melder Export',
                text: 'Hier sind die gescannten Melderdaten im JSON-Format.'
            }).catch(err => console.log("Teilen abgebrochen", err));
        } else {
            let mailtoLink = "mailto:?subject=BMA%20Melder%20Export&body=" + encodeURIComponent(dataStr);
            window.location.href = mailtoLink;
        }
    }

    function clearLocalStorage() {
        if (confirm("Möchten Sie wirklich ALLE gespeicherten Melderdaten von diesem iPhone löschen?")) {
            localStorage.removeItem(STORAGE_KEY);
            updatePreview();
        }
    }
</script>

</body>
</html>
